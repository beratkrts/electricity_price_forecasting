services:
  # 1. PostgreSQL Veritabanı Servisi
  db:
    image: postgres:15-alpine
    container_name: enerji_postgres
    restart: always
    command: postgres -c timezone='Europe/Istanbul'
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-enerji_db}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      TZ: Europe/Istanbul
      PGTZ: Europe/Istanbul
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/sql/01_init_schema.sql:/docker-entrypoint-initdb.d/01_init_schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-postgres} -d $${POSTGRES_DB:-enerji_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. Python ETL & Veri Çekme Daemon Servisi
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: enerji_etl_app
    restart: always
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
      - POSTGRES_DB=${POSTGRES_DB:-enerji_db}
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - TZ=Europe/Istanbul
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    expose:
      - "8000"
  # 3. Frontend Dashboard Servisi (React + Vite + Nginx)
  dashboard:
    build:
      context: ./app/frontend
      dockerfile: Dockerfile
    container_name: enerji_dashboard
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - db
      - app

volumes:
  postgres_data:
